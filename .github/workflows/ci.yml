name: Daily News Publisher

on:
  schedule:
    - cron: "0 9 * * *"   # her gün saat 09:00'da çalışır
  workflow_dispatch:       # elle tetikleme için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOGGER_SITE_ID: ${{ secrets.BLOGGER_SITE_ID }}
        BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
      run: python main.py
