name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repo'yu çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # Google Cloud kimlik doğrulama
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ucakbileti-1350
          service_account_key: ${{ secrets.GCLOUD_CREDENTIALS }}
          export_default_credentials: true

      # Python ortamı hazırla
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Bağımlılıkları yükle
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Script'i çalıştır
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_SITE_TR_ID: ${{ secrets.BLOGGER_SITE_TR_ID }}
          BLOGGER_TOKEN_TR: ${{ secrets.BLOGGER_TOKEN_TR }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          gcloud config set project ucakbileti-1350
          gcloud info
          python main.py
