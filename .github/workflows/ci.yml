name: Daily News Publisher

on:
  schedule:
    - cron: "0 9 * * *"   # her gün saat 09:00'da çalışır
  workflow_dispatch:       # elle tetikleme için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clear pip cache
        run: pip cache purge

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install google-genai
        run: pip install --upgrade --force-reinstall google-genai==0.2.0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show google-genai details
        run: pip show google-genai

      - name: List installed packages
        run: pip list | grep google

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_SITE_TR_ID: ${{ secrets.BLOGGER_SITE_TR_ID }}
          BLOGGER_TOKEN_TR: ${{ secrets.BLOGGER_TOKEN_TR }}
        run: python main.py

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Google Cloud ayarlarını yükle
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCLOUD_CREDENTIALS }}
          export_default_credentials: true

      - name: Blogger API ile deploy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_SITE_ID: ${{ secrets.BLOGGER_SITE_TR_ID }}
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN_TR }}
        run: |
          gcloud config set project ucakbileti-1350
          gcloud info
          python main.py
